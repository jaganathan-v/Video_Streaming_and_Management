worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Internal Docker DNS resolver with 5s TTL, IPv6 disabled for Windows stability
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Gzip for text/json
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream API replicas (Docker DNS resolution for round-robin)
    upstream api_cluster {
        server api:4000 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    # Upstream Edge tier: consistent hash on $request_uri
    upstream edge_cluster {
        hash $request_uri consistent;
        server edge1:80 max_fails=3 fail_timeout=5s;
        server edge2:80 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    # Upstream Web frontend
    upstream web_cluster {
        server web:80 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # Healthcheck
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "lb ok\n";
        }

        # API routing
        location /api/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            # Proxy buffering off for uploads
            proxy_request_buffering off;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # HLS routing to edge1/edge2 with consistent hashing
        location /hls/ {
            proxy_pass http://edge_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Web SPA routing
        location / {
            proxy_pass http://web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
