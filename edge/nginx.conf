worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Edge proxy cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hls:100m max_size=5g inactive=24h use_temp_path=off;
    proxy_cache_key "$uri";

    upstream origin_backend {
        server origin:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Provide /healthz returning 200
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "edge ok\n";
        }

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_cache hls;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie;

        # Add tracking and CORS headers
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Edge $hostname always;
        add_header Access-Control-Allow-Origin * always;

        # Playlists (.m3u8) cached 60s
        location ~* ^/hls/(.+\.m3u8)$ {
            limit_except GET HEAD OPTIONS { deny all; }
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            rewrite ^/hls/(.*)$ /videos/$1 break;
            proxy_pass http://origin_backend;
            proxy_cache_valid 200 206 60s;
        }

        # Media segments (.ts) and thumbnails (.jpg) cached 7d
        location ~* ^/hls/(.+\.(ts|jpg|jpeg))$ {
            limit_except GET HEAD OPTIONS { deny all; }
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            rewrite ^/hls/(.*)$ /videos/$1 break;
            proxy_pass http://origin_backend;
            proxy_cache_valid 200 206 7d;
        }

        # Catch-all for /hls/
        location /hls/ {
            limit_except GET HEAD OPTIONS { deny all; }
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            rewrite ^/hls/(.*)$ /videos/$1 break;
            proxy_pass http://origin_backend;
            proxy_cache_valid 200 206 60s;
        }
    }
}
