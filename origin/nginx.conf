worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Upstream to MinIO cluster with least_conn and keepalive
    upstream minio_cluster {
        least_conn;
        server minio1:9000 max_fails=3 fail_timeout=10s;
        server minio2:9000 max_fails=3 fail_timeout=10s;
        server minio3:9000 max_fails=3 fail_timeout=10s;
        server minio4:9000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Public GET /videos/... on port 80
    server {
        listen 80;
        server_name _;

        # Healthcheck
        location = /healthz {
            return 200 "origin ok\n";
            add_header Content-Type text/plain;
        }

        location /videos/ {
            proxy_pass http://minio_cluster/videos/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    # S3 API Pass-through on port 9000
    server {
        listen 9000;
        server_name _;

        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Host must be preserved exactly with $http_host so AWS SigV4 signatures validate
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
